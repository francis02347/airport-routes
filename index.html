<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlightConnections Clone - Mapa de Rutas Aéreas</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet JS CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Custom CSS for map and scrollbars -->
  <style>
    #map {
      height: 100vh;
      width: 100vw;
      background: #0f172a; /* Slate 900 background matching the map theme */
    }
    /* Style scrollbars in the sidebar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(30, 41, 59, 0.5); /* Slate 800 semi-transparent */
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3); /* Slate 400 */
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.5);
    }
    /* Pulse animation for selected airport marker */
    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .leaflet-selected-marker {
      background: #facc15; /* Yellow 400 */
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px #facc15;
    }

    /* Dark theme for Leaflet Popups */
    .leaflet-popup-content-wrapper {
      background: #0f172a !important; /* slate-900 */
      color: #f1f5f9 !important; /* slate-100 */
      border: 1px solid rgba(71, 85, 105, 0.4);
      border-radius: 12px !important;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5) !important;
    }
    .leaflet-popup-tip {
      background: #0f172a !important; /* slate-900 */
      border: 1px solid rgba(71, 85, 105, 0.4);
    }
    .leaflet-popup-close-button {
      color: #94a3b8 !important; /* slate-400 */
      padding: 8px 8px 0 0 !important;
    }
    .leaflet-popup-close-button:hover {
      color: #ffffff !important;
    }
  </style>
</head>
<body class="h-full w-full overflow-hidden bg-slate-900 text-slate-100 font-sans antialiased">

  <!-- Map Container -->
  <div id="map" class="absolute inset-0 z-0"></div>

  <!-- Floating Toggle Button for Mobile/Responsive -->
  <button id="toggle-sidebar-btn" class="absolute left-4 top-4 z-[999] bg-slate-900/95 backdrop-blur-md border border-slate-700/60 rounded-xl p-3.5 text-cyan-400 shadow-xl hover:bg-slate-800 hover:text-cyan-300 transition flex items-center justify-center hidden" title="Mostrar panel de búsqueda">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>

  <!-- Sidebar Panel -->
  <div id="sidebar" class="absolute left-4 top-4 bottom-4 w-96 max-w-[calc(100vw-2rem)] bg-slate-900/90 backdrop-blur-md rounded-2xl border border-slate-700/50 shadow-2xl flex flex-col z-[1000] overflow-hidden pointer-events-auto transition-transform duration-300 ease-in-out transform translate-x-0">
    <!-- Header -->
    <div class="p-5 border-b border-slate-800 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent flex items-center gap-2 truncate">
          <svg class="w-6 h-6 text-cyan-400 transform -rotate-45 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
          </svg>
          <span class="truncate">FlightConnections</span>
        </h1>
        <p class="text-xs text-slate-400 mt-1 truncate">Explorador de Rutas</p>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="reset-view" class="text-slate-400 hover:text-white p-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition" title="Restablecer vista del mapa">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 7.89M9 11l3-3 3 3m-3-3v12"></path>
          </svg>
        </button>
        <button id="close-sidebar-btn" class="text-slate-400 hover:text-white p-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition" title="Ocultar panel">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Search Section -->
    <div class="p-4 border-b border-slate-800 bg-slate-900/40 relative">
      <label for="search-input" class="sr-only">Buscar aeropuerto</label>
      <div class="relative">
        <input type="text" id="search-input" placeholder="Buscar por ciudad, país o IATA..." 
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 pl-10 text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition text-white placeholder-slate-400" autocomplete="off" />
        <span class="absolute left-3 top-3 text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </span>
        <button id="clear-search" class="absolute right-3 top-3 text-slate-400 hover:text-white hidden">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <!-- Search Results Dropdown -->
      <div id="search-results" class="hidden absolute left-4 right-4 mt-2 max-h-60 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-50 overflow-y-auto custom-scrollbar"></div>
    </div>

    <!-- Main Sidebar Content -->
    <div class="flex-1 overflow-y-auto custom-scrollbar flex flex-col">
      <!-- Instruction Prompt (shown when no airport selected) -->
      <div id="empty-state" class="flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-400">
        <svg class="w-16 h-16 text-slate-600 mb-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path>
        </svg>
        <p class="font-medium text-slate-300">Explora el mapa</p>
        <p class="text-xs text-slate-500 mt-2 px-4">Haz clic en cualquier aeropuerto del mapa o búscalo en el panel para ver todas sus conexiones y rutas directas disponibles.</p>
      </div>

      <!-- Airport Details View (hidden by default) -->
      <div id="detail-state" class="hidden flex-1 flex flex-col">
        <!-- Airport Header Info -->
        <div class="p-5 bg-slate-800/40 border-b border-slate-800/60">
          <div class="flex items-start justify-between">
            <span id="airport-iata" class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 text-lg font-bold px-3 py-1 rounded-lg">JFK</span>
            <button id="close-details" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>
          <h2 id="airport-name" class="text-lg font-bold mt-3 leading-tight text-white">John F. Kennedy International Airport</h2>
          <p id="airport-location" class="text-sm text-slate-400 mt-1 flex items-center gap-1.5">
            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            New York, United States
          </p>
        </div>

        <!-- Connection Summary -->
        <div class="px-5 py-4 border-b border-slate-800 bg-slate-900/20 flex justify-between items-center">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Rutas Directas</span>
          <span id="route-count" class="bg-blue-500/20 text-blue-300 border border-blue-500/30 text-xs px-2.5 py-0.5 rounded-full font-bold">12 destinos</span>
        </div>

        <!-- Destination List -->
        <div id="destinations-list" class="flex-1 overflow-y-auto custom-scrollbar divide-y divide-slate-800/40">
          <!-- Dynamically filled with destination items -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="data.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
